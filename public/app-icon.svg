<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle inner border pattern -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#34d399" stroke-width="2.5" stroke-opacity="0.35" stroke-dasharray="8 6" />

  <!-- Center Decorative Glow -->
  <circle cx="256" cy="240" r="140" fill="#10b981" opacity="0.18" filter="blur(30px)" />

  <!-- Open Quran Book Icon -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Book Spine & Pages -->
    <!-- Left Page -->
    <path d="M 256 330 C 210 305 130 300 85 315 L 85 165 C 130 150 210 155 256 180 Z" fill="#ffffff" />
    <!-- Left Page Texture Lines -->
    <path d="M 120 195 C 160 185 215 190 236 205 M 120 225 C 160 215 215 220 236 235 M 120 255 C 160 245 215 250 236 265 M 120 285 C 160 275 215 280 236 295" stroke="#cbd5e1" stroke-width="4.5" stroke-linecap="round" />

    <!-- Right Page -->
    <path d="M 256 330 C 302 305 382 300 427 315 L 427 165 C 382 150 302 155 256 180 Z" fill="#f8fafc" />
    <!-- Right Page Texture Lines -->
    <path d="M 392 195 C 352 185 297 190 276 205 M 392 225 C 352 215 297 220 276 235 M 392 255 C 352 245 297 250 276 265 M 392 285 C 352 275 297 280 276 295" stroke="#cbd5e1" stroke-width="4.5" stroke-linecap="round" />

    <!-- Book Center Fold / Spine Shadow -->
    <path d="M 252 180 L 260 180 L 260 332 L 252 332 Z" fill="#047857" opacity="0.6" />

    <!-- Bookmark Ribbon in Gold -->
    <path d="M 251 180 Q 256 250 258 350 L 270 338 L 282 350 Q 268 250 261 180 Z" fill="url(#goldGrad)" />

    <!-- Rehal (Book Stand) Base -->
    <path d="M 155 330 L 195 380 L 317 380 L 357 330 C 320 345 280 345 256 338 C 232 345 192 345 155 330 Z" fill="url(#goldGrad)" opacity="0.9" />
  </g>

  <!-- App Title Bottom Text -->
  <text x="256" y="440" font-family="'Hind Siliguri', 'Kalpurush', 'Segoe UI', sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">আল-কুরআন</text>
  <text x="256" y="468" font-family="'Hind Siliguri', 'Kalpurush', 'Segoe UI', sans-serif" font-size="16" font-weight="500" fill="#a7f3d0" text-anchor="middle" letter-spacing="2">বাংলা অনুবাদ</text>
</svg>
